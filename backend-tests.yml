name: Backend Tests

on:
  push:
    paths:
      - "backend/**"
  pull_request:
    paths:
      - "backend/**"

jobs:
  test-backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sales_user
          POSTGRES_PASSWORD: sales_password
          POSTGRES_DB: sales_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U sales_user"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Run tests
        working-directory: backend
        env:
          DB_USER: sales_user
          DB_PASS: sales_password
          DB_HOST: localhost
          DB_NAME: sales_db
        run: pytest -q
